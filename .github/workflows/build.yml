
name: Build Tiket Bus

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++ to EXE
        run: |
          g++ main.cpp -o tiket_bus.exe -static -std=c++11

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tiket-Bus-EXE
          path: tiket_bus.exe
