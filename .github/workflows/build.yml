
name: Build Tiket Bus EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Compile Program C++
        shell: cmd
        run: g++ main.cpp -o tiket_bus.exe -static

      - name: Upload File EXE
        uses: actions/upload-artifact@v4
        with:
          name: tiket_bus
          path: tiket_bus.exe
